# Нужно само ако деплойваш с Wrangler (npx wrangler deploy).
# При деплой през сайта на Cloudflare настройките се задават в Worker → Settings.
name = "plot-lookup"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "plot-lookup-db"
database_id = "5a3fc338-9493-4359-9d68-3deb410eea05"

[vars]
RETENTION_DAYS = "365"
# ADMIN_KEY е тайна: npx wrangler secret put ADMIN_KEY

# Изтрива записи по-стари от RETENTION_DAYS всяка нощ в 03:00 UTC
[triggers]
crons = ["0 3 * * *"]
